server {
    listen 80;
    server_name _;

    # Большие тела запросов на всякий случай (длинные комментарии, и т.п.)
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # API → backend
    location /api/ {
        proxy_pass http://koord-hr-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-poll/SSE friendliness — на будущее
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA: длинный кеш для assets с хешами в имени
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: всё остальное — index.html, history mode
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
